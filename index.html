<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Čápi Jedovnice - Výřez</title>
    <style>
        /* Černé pozadí přes celý monitor */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Výřezový kontejner fixovaný přesně na střed (1200x675) */
        #cropWrapper {
            width: 1200px;
            height: 675px;
            position: relative;
            overflow: hidden;
            background-color: #000000;
            transform-origin: center center;
        }

        /* Vložení originálního přehrávače a posun o vaše pixelové souřadnice */
        iframe {
            position: absolute !important;
            width: 1920px !important;
            height: 1080px !important;
            left: -378px !important;
            top: -329px !important;
            border: none !important;
            background: #000000;
        }
    </style>
</head>
<body>

    <div id="cropWrapper">
        <!-- Vkládáme přímo oficiální stránku se samotným streamem, což obchází veškeré CORS ochrany -->
        <iframe src="https://ign.cz/kamera/capi/capi.m3u8" allow="autoplay; fullscreen"></iframe>
    </div>

    <script>
        var wrapper = document.getElementById('cropWrapper');

        // Matematické roztažení výřezu na maximum podle velikosti okna se zachováním poměru stran
        function prizpusobVelikost() {
            var oknoSirka = window.innerWidth;
            var oknoVyska = window.innerHeight;
            
            var meritkoSirka = oknoSirka / 1200;
            var meritkoVyska = oknoVyska / 675;
            
            var vysledneMeritko = Math.min(meritkoSirka, meritkoVyska);
            
            wrapper.style.transform = `scale(${vysledneMeritko})`;
        }

        window.addEventListener('resize', prizpusobVelikost);
        prizpusobVelikost();
    </script>

</body>
</html>

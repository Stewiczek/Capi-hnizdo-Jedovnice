<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Čápi - Živý výřez</title>
    
    <!-- Oficiální Hls.js knihovna běžící bezpečně pod HTTPS -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Výřezový kontejner fixovaný přesně na střed */
        #cropWrapper {
            width: 1200px;
            height: 675px;
            position: relative;
            overflow: hidden;
            background-color: #000000;
            transform-origin: center center;
        }

        /* Vynucení rozměrů vnitřního přehrávače a jeho ořez */
        video {
            position: absolute !important;
            width: 1920px !important;
            height: 1080px !important;
            left: -378px !important;
            top: -329px !important;
            background: #000000;
        }
    </style>
</head>
<body>

    <div id="cropWrapper">
        <video id="capi-stream" controls autoplay muted playsinline></video>
    </div>

    <script>
        var wrapper = document.getElementById('cropWrapper');
        var video = document.getElementById('capi-stream');
        
        // Na HTTPS hostingu již nepotřebujeme žádné složité okliky ani maskování adresy
        var urlStreamu = 'https://ign.cz';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(urlStreamu);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = urlStreamu;
            video.play();
        }

        // Matematické roztažení na celou plochu okna se stoprocentním vycentrováním
        function prizpusobVelikost() {
            var oknoSirka = window.innerWidth;
            var oknoVyska = window.innerHeight;
            
            var meritkoSirka = oknoSirka / 1200;
            var meritkoVyska = oknoVyska / 675;
            
            var vysledneMeritko = Math.min(meritkoSirka, meritkoVyska);
            
            wrapper.style.transform = `scale(${vysledneMeritko})`;
        }

        window.addEventListener('resize', prizpusobVelikost);
        prizpusobVelikost();
    </script>

</body>
</html>
